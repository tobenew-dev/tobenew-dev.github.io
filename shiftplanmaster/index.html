function personBusy(p,date){
  const buf=0;let iv=[],block=false;const frees=[],ap=[];
  for(const k of [-1,0,1]){
    (state.appts||[]).forEach(a=>{if(a.date!==addDays(date,k))return;if(p!=='me'&&!(a.with||[]).includes(p.id))return;const s1=tmin(a.st);let e1=tmin(a.en);if(e1<=s1)e1+=1440;ap.push([s1+k*1440,e1+k*1440])});
    const e=entryFor(p,addDays(date,k));if(!e)continue;
    const sp=span(e),off=k*1440,L=leaveOf(e);
    if(sp){
      let segs=[[sp[0],sp[1]]];
      if(L){if(L.full)segs=[];else{const mid=(sp[0]+sp[1])/2;segs=L.half==='am'?[[mid,sp[1]]]:[[sp[0],mid]]}}

function monthLog(y,m){

    else if(e.s==='L')R.push({d,date,t:'휴가',c:'lv',txt:e.lk||'',part:'종일'});
    (e.outs||[]).forEach(o=>R.push({d,date,t:'외출',c:'ou',st:o.st,txt:hm(tmin(o.st))+'–'+hm(tmin(o.st)+o.min)+' ('+hrs(o.min)+')'+(o.note?' · '+o.note:'')}));
    (e.xw||[]).forEach(o=>R.push({d,date,t:'초과 근무',c:'xw',st:o.st,min:o.min,txt:hm(tmin(o.st))+'–'+hm(tmin(o.st)+o.min)+' ('+hrs(o.min)+')'+(o.note?' · '+o.note:'')}));
    state.appts.filter(a=>a.date===date).forEach(a=>{const nm=(a.with||[]).map(id=>{const x=state.mates.find(q=>q.id===id);return x?x.name:''}).filter(Boolean);
      R.push({d,date,t:'약속',c:'ap',st:a.st,txt:a.st+'–'+a.en+' · '+(a.title||'약속')+(a.place?' · '+a.place:'')+(nm.length?' · '+nm.join(', '):'')})});

    const L=R.filter(r=>r.t===t);
    return `<div class="mlog"><h2 class="t"><span class="mtag ${c}">${t}</span> <span class="sub">${L.length}건${t==='초과 근무'?' · '+hrs(L.reduce((a,r)=>a+(r.min||0),0)):''}</span></h2>`+(L.length?'<ul class="list">'+L.map(r=>{const dt=pdate(r.date);return `<li><div class="sd"><b>${r.d}</b><span>${WD[dt.getDay()]}</span></div><div class="grow">${esc(r.txt)}${r.part?`<span class="mpart">${esc(r.part)}</span>`:''}</div></li>`}).join('')+'</ul>':`<p class="muted" style="margin:0">이번 달 ${t} 기록이 없어요.</p>`)+'</div>';

function xlRows(){
  const days=Object.keys(state.me.days).sort(),W=[['날짜','요일','근무','시작','종료','휴가','휴가항목','메모']],O=[['날짜','시작','종료','메모']],X=[['날짜','시작','종료','메모']];
  days.forEach(d=>{
    const e=state.me.days[d];if(!e)return;const g=WD[pdate(d).getDay()];
    if(e.s||e.leave||e.memo||e.lk)W.push([d,g,e.s?xlShiftName(e.s):'',e.o&&e.o.st||'',e.o&&e.o.en||'',e.leave?e.leave.t:'',e.lk||'',e.memo||'']);
    (e.outs||[]).forEach(o=>O.push([d,o.st,hm(tmin(o.st)+o.min),o.note||'']));

  });
  const A=[['날짜','시작','종료','제목','장소','함께']];
  state.appts.slice().sort((a,b)=>(a.date+a.st).localeCompare(b.date+b.st)).forEach(a=>A.push([a.date,a.st,a.en,a.title||'',a.place||'',(a.with||[]).map(id=>{const m=state.mates.find(x=>x.id===id);return m?m.name:''}).filter(Boolean).join(', ')]));
  return {W,O,X,A};
}

const xlT=v=>{if(v==null||v==='')return '';if(typeof v==='number'){return hm(v<1?v*1440:v)}

function xlFindShift(n,L){n=String(n||'').trim();if(!n)return null;return (L||state.shifts).find(s=>s.name===n||s.short===n||(s.eng&&(s.eng.short===n||s.eng.name===n)))||null}
async function xlRead(file){
  let wb;try{wb=await XL.read(await file.arrayBuffer())}catch(e){toast('엑셀 파일을 읽을 수 없어요');return}
  const rows=n=>wb[n]?wb[n].slice(1):null;
  let cfg=null;const CS=rows('앱설정');
  if(CS){try{const o=JSON.parse(CS.map(r=>r[0]||'').join(''));if(o&&o.shifts&&o.patterns)cfg=o}catch(e){}}
  const SL=cfg?cfg.shifts:state.shifts,ML=cfg?(cfg.mates||[]):state.mates;
  const W=rows('근무'),O=rows('외출'),XW=rows('초과근무'),A=rows('약속');
  if(!W&&!O&&!XW&&!A&&!cfg){toast('근무·외출·초과근무·약속 시트를 찾을 수 없어요');return}
  const p={days:{},outs:[],xw:[],appts:null,bad:0,cfg};
  (W||[]).forEach(r=>{const d=xlD(r[0]);if(!d){if(r.some(v=>v!==''))p.bad++;return}
    const e={};const n=String(r[2]||'').trim();
    if(n){const s=xlFindShift(n,SL);if(!s){p.bad++;return}e.s=s.id}
    const st=xlT(r[3]),en=xlT(r[4]);if(e.s&&st&&en)e.o={st,en};
    const lt=String(r[5]||'').trim();if(lt){if(LEAVES[lt])e.leave={t:lt};else p.bad++}
    const lk=String(r[6]||'').trim();if(lk)e.lk=lk;const mm=String(r[7]||'').trim();if(mm)e.memo=mm;
    p.days[d]=e});
  const tm=(rr,dest)=>(rr||[]).forEach(r=>{const d=xlD(r[0]),st=xlT(r[1]),en=xlT(r[2]);if(!d||!st||!en){if(r.some(v=>v!==''))p.bad++;return}
    let min=tmin(en)-tmin(st);if(min<=0)min+=1440;dest.push({d,st,min,note:String(r[3]||'').trim()})});
  tm(O,p.outs);tm(XW,p.xw);
  if(A){p.appts=[];A.forEach(r=>{const d=xlD(r[0]),st=xlT(r[1]),en=xlT(r[2]);if(!d||!st||!en){if(r.some(v=>v!==''))p.bad++;return}
    const names=String(r[5]||'').split(/[,،、]/).map(s=>s.trim()).filter(Boolean);
    p.appts.push({id:uid(),date:d,st,en,title:String(r[3]||'').trim()||'약속',place:String(r[4]||'').trim(),with:names.map(n=>{const m=ML.find(x=>x.name===n);return m?m.id:null}).filter(Boolean)})})}
  ui.xl=p;ui.setOpen=ui.setOpen||{};ui.setOpen.bk=true;render();
}
function xlApply(full){
  const p=ui.xl;if(!p)return;
  if(full&&p.cfg){const kd=state.me.days,ka=state.appts;state=fix(Object.assign({},p.cfg,{me:{days:kd,meta:(p.cfg.me&&p.cfg.me.meta)||{}},appts:ka}));state.example=false}
  const D=Object.keys(p.days);
  D.forEach(d=>{const cur=state.me.days[d]||{};['s','o','leave','lk','ps','m','outs','xw','memo'].forEach(k=>delete cur[k]);state.me.days[d]=cur});
  D.forEach(d=>{const e=state.me.days[d],n=p.days[d];Object.assign(e,n);if(n.s){e.m=cycleShiftFor(d)!==n.s}});
  const cl=new Set(D);p.outs.concat(p.xw).forEach(o=>cl.add(o.d));
  cl.forEach(d=>{if(!state.me.days[d])state.me.days[d]={}});
  const outD=new Set(p.outs.map(o=>o.d)),xwD=new Set(p.xw.map(o=>o.d));
  outD.forEach(d=>{state.me.days[d].outs=[]});xwD.forEach(d=>{state.me.days[d].xw=[]});
  p.outs.forEach(o=>state.me.days[o.d].outs.push({id:uid(),st:o.st,min:o.min,note:o.note}));
  p.xw.forEach(o=>state.me.days[o.d].xw.push({id:uid(),st:o.st,min:o.min,note:o.note}));
  if(p.appts){const ad=new Set(p.appts.map(a=>a.date));state.appts=state.appts.filter(a=>!ad.has(a.date)).concat(p.appts)}
  Object.keys(state.me.days).forEach(d=>{if(isEmpty(state.me.days[d])&&!state.me.days[d].m)delete state.me.days[d]});
  save();ui.xl=null;render();toast('가져왔어요');
}
function xlBox(){
  const p=ui.xl;
  let h=`<p class="hint" style="margin:0 0 8px">근무표를 데이터는 이 기기의 브라우저에만 저장돼요. 엑셀 파일로 저장해 두고, 같은 파일로 다시 가져올 수 있어요. 근무 종류·사이클·동료·설정까지 모두 들어가서 이 파일 하나가 전체 백업이에요.</p><div class="row" style="margin-top:0"><button class="btn" data-act="xlSave">엑셀로 저장</button><label class="btn" for="xlFile" style="cursor:pointer">엑셀 가져오기</label><input type="file" id="xlFile" data-chg="xlFile" accept=".xlsx,.xls" hidden></div>`;
  if(p){const nd=Object.keys(p.days).length;
    h+=`<div class="apbox" style="margin-top:10px"><b>가져올 내용</b><div class="muted">근무 ${nd}일 · 외출 ${p.outs.length}건 · 초과근무 ${p.xw.length}건${p.appts?' · 약속 '+p.appts.length+'건':''}${p.cfg?' · 설정(근무 종류·사이클·동료 등) 포함':''}</div>${p.bad?`<div class="muted">읽지 못한 줄 ${p.bad}개는 건너뛰어요.</div>`:''}<div class="hint" style="margin:6px 0">파일에 있는 날짜의 기존 근무·휴가·외출·초과근무·메모는 파일 내용으로 바뀌어요.${p.appts?' 약속도 파일에 있는 날짜는 바뀌어요.':''}</div><div class="row" style="margin-top:0">${p.cfg?'<button class="btn primary" data-act="xlApply" data-v="full">전체 복원</button><button class="btn" data-act="xlApply" data-v="rows">근무·약속만</button>':'<button class="btn primary" data-act="xlApply" data-v="rows">적용</button>'}<button class="btn" data-act="xlCancel">취소</button></div></div>`}
  return h;
}

/* ===== 자체 엑셀(.xlsx) 읽기/쓰기 — 외부 라이브러리 없이 동작 ===== */
const XL=(()=>{
  const enc=new TextEncoder(),dec=new TextDecoder('utf-8');
  const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  const esc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  function zip(files){
    const parts=[],cd=[];let off=0;
    files.forEach(f=>{
      const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,c=crc(data);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
      lh.setUint32(14,c,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer),name,data);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
      ch.setUint32(16,c,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
      cd.push(new Uint8Array(ch.buffer),name);
      off+=30+name.length+data.length;
    });
    const cdLen=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdLen,true);end.setUint32(16,off,true);
    const all=parts.concat(cd,[new Uint8Array(end.buffer)]),out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;all.forEach(b=>{out.set(b,p);p+=b.length});return out;
  }
  function write(sheets){
    const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',files=[];
    files.push({name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'});
    files.push({name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});
    files.push({name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'});
    files.push({name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
    files.push({name:'xl/styles.xml',data:H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'});
    sheets.forEach((s,i)=>{
      let x=H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
      if(s.cols)x+='<cols>'+s.cols.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
      x+='<sheetData>'+s.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
        if(v===''||v==null)return '';
        return `<c r="${colName(ci)}${ri+1}" t="inlineStr" s="${ri===0?1:0}"><is><t xml:space="preserve">${esc(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>';
      files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:x});
    });

  }
  async function inflate(b){
    const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(b);w.close();
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  async function unzip(buf){
    const u=new Uint8Array(buf),dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let e=-1;
    for(let i=u.length-22;i>=Math.max(0,u.length-65600);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
    if(e<0)throw new Error('zip');
    const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
    for(let k=0;k<n;k++){

      const name=dec.decode(u.subarray(p+46,p+46+nl));
      const ls=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ls,ls+cs);
      out[name]=meth===0?raw:meth===8?await inflate(raw):null;

    }
    return out;
  }
  const un=s=>s.replace(/&(#x[0-9a-fA-F]+|#\d+|lt|gt|amp|quot|apos);/g,(m,g)=>g[0]==='#'?String.fromCodePoint(g[1]==='x'?parseInt(g.slice(2),16):+g.slice(1)):({lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"})[g]);
  const txt=s=>{let o='',m;const re=/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;while((m=re.exec(s)))o+=un(m[1]);return o};
  const colIdx=r=>{let n=0;for(const ch of r.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
  async function read(buf){
    const z=await unzip(buf),T=k=>z[k]?dec.decode(z[k]):'';
    const wbx=T('xl/workbook.xml'),rels=T('xl/_rels/workbook.xml.rels');
    if(!wbx)throw new Error('xlsx');
    const tgt={};let m;const rr=/<Relationship\b[^>]*>/g;
    while((m=rr.exec(rels))){const id=(/\bId="([^"]*)"/.exec(m[0])||[])[1],t=(/\bTarget="([^"]*)"/.exec(m[0])||[])[1];if(id&&t)tgt[id]=t.replace(/^\//,'').replace(/^(?!xl\/)/,'xl/')}
    const SS=[];const sx=T('xl/sharedStrings.xml'),sre=/<si\b[^>]*>([\s\S]*?)<\/si>|<si\s*\/>/g;
    while((m=sre.exec(sx)))SS.push(m[1]?txt(m[1]):'');
    const out={},sre2=/<sheet\b[^>]*>/g;
    while((m=sre2.exec(wbx))){
      const name=un((/\bname="([^"]*)"/.exec(m[0])||[])[1]||''),rid=(/\br:id="([^"]*)"/.exec(m[0])||[])[1],xml=T(tgt[rid]||'');
      const rows=[];let rm;const rowRe=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
      while((rm=rowRe.exec(xml))){
        const row=[];const cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;let cm,ci=0;
        while((cm=cre.exec(rm[1]||''))){
          const at=cm[1],body=cm[2]||'',ref=(/\br="([A-Z]+\d+)"/.exec(at)||[])[1],t=(/\bt="([^"]*)"/.exec(at)||[])[1];
          if(ref)ci=colIdx(ref);
          let v='';const vm=/<v>([\s\S]*?)<\/v>/.exec(body);
          if(t==='inlineStr')v=txt(body);
          else if(vm){const raw=un(vm[1]);v=t==='s'?(SS[+raw]||''):t==='str'||t==='e'?raw:t==='b'?raw==='1':(raw===''?'':+raw)}
          while(row.length<ci)row.push('');row[ci]=v;ci++;
        }

        while(rows.length<rn-1)rows.push([]);rows[rn-1]=row;
      }
      const w=rows.reduce((a,r)=>Math.max(a,r.length),0);
      out[name]=rows.map(r=>{const c=r.slice();while(c.length<w)c.push('');return c});
    }

  }

})();
